<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الحظ والمخاطرة 🎲</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      get,
      update,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

    // 🔥 الصقي firebaseConfig مالج هنا
    const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "luck-game-3285f.firebaseapp.com",
  projectId: "luck-game-3285f",
  databaseURL: "https://luck-game-3285f-default-rtdb.europe-west1.firebasedatabase.app",
  storageBucket: "luck-game-3285f.firebasestorage.app",
  messagingSenderId: "412953420597",
  appId: "1:412953420597:web:7ef2dfd8c94a4e3a95a27c"
};
      // ضعي إعدادات Firebase هنا
   

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.firebaseDB = db;
    window.firebaseRef = ref;
    window.firebaseSet = set;
    window.firebaseGet = get;
    window.firebaseUpdate = update;
    window.firebaseOnValue = onValue;

    document.dispatchEvent(new Event("firebase-ready"));
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .screen {
      min-height: 100vh;
      padding: 30px 15px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: #1d1d1d;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      color: #ff4d4d;
    }

    h2 {
      color: #ff7777;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #555;
      background: #292929;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 13px 20px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      background: #d62828;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ff4444;
    }

    .hidden {
      display: none;
    }

    .room-code {
      font-size: 28px;
      color: #ffd166;
      font-weight: bold;
      letter-spacing: 4px;
      margin: 15px;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .player {
      background: #292929;
      padding: 15px;
      border-radius: 12px;
    }

    .points {
      color: #ffd166;
      font-size: 24px;
      font-weight: bold;
    }

    .status {
      margin: 15px 0;
      color: #bbb;
    }
  </style>
</head>

<body>

  <!-- الصفحة الرئيسية -->
  <section id="home" class="screen">
    <div class="box">
      <h1>🎲 لعبة الحظ والمخاطرة</h1>

      <h2>إنشاء غرفة</h2>

      <input id="createName" placeholder="اسمك">

      <button onclick="createRoom()">
        إنشاء غرفة 🎮
      </button>

      <hr>

      <h2>دخول غرفة</h2>

      <input id="roomCode" placeholder="رمز الغرفة">

      <input id="joinName" placeholder="اسمك">

      <button onclick="joinRoom()">
        دخول 🚪
      </button>

      <p id="message"></p>
    </div>
  </section>


  <!-- غرفة الانتظار -->
  <section id="lobby" class="screen hidden">
    <div class="box">

      <h1>🎲 غرفة اللعبة</h1>

      <p>رمز الغرفة:</p>

      <div id="showRoomCode" class="room-code"></div>

      <p class="status">
        أرسل هذا الرمز إلى أصدقائك حتى يدخلوا للغرفة.
      </p>

      <h2>اللاعبون</h2>

      <div id="lobbyPlayers" class="players"></div>

      <p id="lobbyStatus" class="status"></p>

      <button id="startButton" class="hidden" onclick="startGame()">
        ابدأ اللعبة 🚀
      </button>

    </div>
  </section>


  <!-- اللعبة -->
  <section id="game" class="screen hidden">
    <div class="box">

      <h1>🎲 الحظ والمخاطرة</h1>

      <h2 id="roundText">الجولة 1</h2>

      <p id="turnText"></p>

      <div id="gamePlayers" class="players"></div>

      <div id="gameActions"></div>

    </div>
  </section>


<script>

let roomId = null;
let myPlayerId = null;
let gameData = null;

const TOTAL_ROUNDS = 10;


/* إنشاء رمز غرفة */

function generateRoomCode() {

  return Math.random()
    .toString(36)
    .substring(2, 8)
    .toUpperCase();

}


/* إنشاء معرف لاعب */

function generatePlayerId() {

  return "p_" +
    Math.random()
      .toString(36)
      .substring(2, 10);

}


/* انتظار Firebase */

document.addEventListener("firebase-ready", () => {

  console.log("Firebase جاهز ✅");

});


/* إنشاء غرفة */

async function createRoom() {

  const name =
    document.getElementById("createName").value.trim();

  if (!name) {

    showMessage("اكتبي اسمج أولاً ❤️");
    return;

  }

  roomId = generateRoomCode();

  myPlayerId = generatePlayerId();

  const player = {

    id: myPlayerId,
    name: name,
    points: 100

  };

  const room = {

    status: "waiting",

    round: 0,

    currentPlayer: 0,

    players: {

      [myPlayerId]: player

    }

  };

  try {

    await firebaseSet(
      firebaseRef(firebaseDB, "rooms/" + roomId),
      room
    );

    openLobby();

    listenToRoom();

  } catch (error) {

    console.error(error);

    showMessage(
      "صار خطأ بالاتصال بـ Firebase 😢"
    );

  }

}


/* دخول غرفة */

async function joinRoom() {

  const code =
    document.getElementById("roomCode")
      .value
      .trim()
      .toUpperCase();

  const name =
    document.getElementById("joinName")
      .value
      .trim();

  if (!code || !name) {

    showMessage(
      "اكتبي رمز الغرفة واسمج ❤️"
    );

    return;

  }

  try {

    const roomRef =
      firebaseRef(
        firebaseDB,
        "rooms/" + code
      );

    const snapshot =
      await firebaseGet(roomRef);

    if (!snapshot.exists()) {

      showMessage(
        "ماكو غرفة بهذا الرمز ❌"
      );

      return;

    }

    const room =
      snapshot.val();

    const playerCount =
      room.players
        ? Object.keys(room.players).length
        : 0;

    if (playerCount >= 4) {

      showMessage(
        "الغرفة ممتلئة 😭"
      );

      return;

    }

    if (room.status !== "waiting") {

      showMessage(
        "اللعبة بدأت بالفعل 🎲"
      );

      return;

    }

    roomId = code;

    myPlayerId =
      generatePlayerId();

    const player = {

      id: myPlayerId,
      name: name,
      points: 100

    };

    await firebaseUpdate(
      roomRef,
      {

        ["players/" + myPlayerId]:
          player

      }

    );

    openLobby();

    listenToRoom();

  } catch (error) {

    console.error(error);

    showMessage(
      "صار خطأ أثناء الدخول 😢"
    );

  }

}


/* الاستماع لتغييرات الغرفة */

function listenToRoom() {

  const roomRef =
    firebaseRef(
      firebaseDB,
      "rooms/" + roomId
    );

  firebaseOnValue(
    roomRef,
    snapshot => {

      if (!snapshot.exists()) {
        return;
      }

      gameData =
        snapshot.val();

      updateLobby();

      if (
        gameData.status === "playing"
      ) {

        openGame();

        renderGame();

      }

    }
  );

}


/* عرض غرفة الانتظار */

function openLobby() {

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("lobby")
    .classList.remove("hidden");

  document
    .getElementById("showRoomCode")
    .textContent = roomId;

}


/* تحديث اللاعبين */

function updateLobby() {

  if (!gameData || !gameData.players) {
    return;
  }

  const players =
    Object.values(
      gameData.players
    );

  const container =
    document.getElementById(
      "lobbyPlayers"
    );

  container.innerHTML = "";

  players.forEach(
    (player, index) => {

      const div =
        document.createElement("div");

      div.className = "player";

      div.innerHTML =
        `<strong>👤 ${player.name}</strong>`;

      container.appendChild(div);

    }
  );

  document
    .getElementById("lobbyStatus")
    .textContent =
      players.length +
      " / 4 لاعبين دخلوا";

  /*
    أول لاعب هو صاحب الغرفة
  */

  const firstPlayer =
    players[0];

  if (
    firstPlayer &&
    firstPlayer.id === myPlayerId &&
    players.length >= 2
  ) {

    document
      .getElementById("startButton")
      .classList.remove("hidden");

  } else {

    document
      .getElementById("startButton")
      .classList.add("hidden");

  }

}


/* بدء اللعبة */

async function startGame() {

  if (!gameData) return;

  const players =
    Object.values(
      gameData.players
    );

  if (players.length < 2) {

    alert(
      "لازم يدخل لاعبين على الأقل."
    );

    return;

  }

  await firebaseUpdate(

    firebaseRef(
      firebaseDB,
      "rooms/" + roomId
    ),

    {

      status: "playing",

      round: 1,

      currentPlayer: 0

    }

  );

}


/* فتح شاشة اللعبة */

function openGame() {

  document
    .getElementById("lobby")
    .classList.add("hidden");

  document
    .getElementById("game")
    .classList.remove("hidden");

}


/* عرض اللعبة */

function renderGame() {

  if (!gameData) return;

  const players =
    Object.values(
      gameData.players || {}
    );

  document
    .getElementById("roundText")
    .textContent =
      "الجولة " +
      gameData.round +
      " / " +
      TOTAL_ROUNDS;

  const current =
    players[
      gameData.currentPlayer
    ];

  document
    .getElementById("turnText")
    .textContent =
      current
        ? "الدور الآن: " + current.name
        : "";

  const container =
    document.getElementById(
      "gamePlayers"
    );

  container.innerHTML = "";

  players.forEach(
    player => {

      const div =
        document.createElement("div");

      div.className =
        "player";

      div.innerHTML = `
        <strong>👤 ${player.name}</strong>
        <div class="points">
          ${player.points}
        </div>
        <small>نقطة</small>
      `;

      container.appendChild(div);

    }
  );

  renderActions();

}


/* بطاقات الحظ */

function renderActions() {

  const actions =
    document.getElementById(
      "gameActions"
    );

  actions.innerHTML = "";

  const players =
    Object.values(
      gameData.players || {}
    );

  const current =
    players[
      gameData.currentPlayer
    ];

  if (!current) return;

  if (current.id !== myPlayerId) {

    actions.innerHTML =
      "<p class='status'>انتظري دورج... ⏳</p>";

    return;

  }

  actions.innerHTML = `
    <h2>اختاري بطاقة 🎴</h2>

    <button onclick="chooseCard(20)">
      🎁 +20
    </button>

    <button onclick="chooseCard(50)">
      💰 +50
    </button>

    <button onclick="chooseCard(100)">
      💎 +100
    </button>

    <button onclick="chooseCard(-20)">
      💥 -20
    </button>

    <button onclick="chooseCard(-50)">
      😈 -50
    </button>

    <button onclick="chooseCard(0)">
      🫥 لا شيء
    </button>
  `;

}


/* اختيار البطاقة */

async function chooseCard(value) {

  const players =
    Object.values(
      gameData.players || {}
    );

  const currentIndex =
    gameData.currentPlayer;

  const current =
    players[currentIndex];

  if (
    !current ||
    current.id !== myPlayerId
  ) {
    return;
  }

  let newPoints =
    current.points + value;

  if (newPoints < 0) {
    newPoints = 0;
  }

  const updates = {};

  updates[
    "rooms/" +
    roomId +
    "/players/" +
    current.id +
    "/points"
  ] = newPoints;

  let nextPlayer =
    currentIndex + 1;

  let nextRound =
    gameData.round;

  if (nextPlayer >= players.length) {

    nextPlayer = 0;

    nextRound++;

  }

  if (nextRound > TOTAL_ROUNDS) {

    await firebaseUpdate(

      firebaseRef(
        firebaseDB,
        "rooms/" + roomId
      ),

      {

        status: "finished"

      }

    );

    return;

  }

  updates[
    "rooms/" +
    roomId +
    "/currentPlayer"
  ] = nextPlayer;

  updates[
    "rooms/" +
    roomId +
    "/round"
  ] = nextRound;

  await firebaseUpdate(

    firebaseRef(
      firebaseDB,
      ""
    ),

    updates

  );

}


/* رسالة */

function showMessage(text) {

  document
    .getElementById("message")
    .textContent = text;

}

</script>

</body>
</html>
